# Gemeinsame Einstellungen für alle Minis.

homebrew_prefix: /opt/homebrew
models_root: /Users/Shared/ai-models

# Ollama läuft als LaunchDaemon unter dem Admin-Konto, auch ohne angemeldeten Nutzer
# und nach Neustarts durch IT-Updates.
ollama_bind: "0.0.0.0:11434"
ollama_keep_alive: 30m          # Modell nach 30 min Leerlauf entladen (Speicher für Laborgruppen frei)
ollama_num_parallel: 2          # gleichzeitige Anfragen pro Modell
ollama_max_loaded_models: 2
ollama_context_length: 16384
ollama_flash_attention: 1

# Ollama.app (Cask aus dem alten Setup) startet bei der Anmeldung einen eigenen Server auf
# Port 11434 und kollidiert mit dem Daemon. Deshalb wird die App entfernt; die Modelle
# im gemeinsamen Cache bleiben erhalten.
ollama_remove_app: true

# Modelle für den Pool (Tags von ollama.com/library, Stand 2026-09-23).
ollama_models:
  - qwen3.6:35b-a3b             # MoE, schnell, Standardmodell
  - gemma4:31b                  # dichtes Modell, Vergleich/Evaluation
  - qwen3-embedding:0.6b        # Embeddings, mehrsprachig

# Wie viele Minis gleichzeitig Modelle laden (schont die Leitung).
model_pull_throttle: 3
