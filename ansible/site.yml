- name: Ollama auf den Mac Minis einrichten
  hosts: minis
  environment:
    PATH: "{{ homebrew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  tasks:
    - name: Prüfen, ob das Proxy-Token vorhanden ist
      ansible.builtin.assert:
        that: ollama_proxy_token | length >= 32
        fail_msg: "ansible/proxy-token fehlt oder ist zu kurz. Bitte ./setup.sh verwenden."
      tags: [always]

    # Dienstkonto
    - name: Dienstkonto abfragen
      ansible.builtin.command: id -u {{ ollama_service_user }}
      register: service_id
      changed_when: false
      failed_when: false
      tags: [base]

    - name: Dienstkonto ohne Login und ohne Admin-Rechte anlegen
      become: true
      ansible.builtin.command: >-
        sysadminctl -addUser {{ ollama_service_user }} -fullName "Ollama-Dienst"
        -UID {{ ollama_service_uid }} -roleAccount
      when: service_id.rc != 0
      tags: [base]

    # Ordner
    - name: Ordner für Modelle und Dienst anlegen
      become: true
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: staff
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ models_root }}", owner: root, mode: "0755" }
        - { path: "{{ models_root }}/ollama", owner: "{{ ollama_service_user }}", mode: "0755" }
        - { path: "{{ ollama_service_home }}", owner: "{{ ollama_service_user }}", mode: "0700" }
        - { path: "{{ config_dir }}", owner: root, mode: "0755" }
      tags: [base]

    - name: Rechte im Modellordner auf das Dienstkonto setzen
      become: true
      ansible.builtin.command: chown -R {{ ollama_service_user }}:staff {{ models_root }}/ollama
      changed_when: false
      tags: [base]

    # Alte App
    - name: Ollama.app beenden (auch bei anderen angemeldeten Nutzern)
      become: true
      ansible.builtin.command: pkill -x Ollama
      register: pkill_app
      changed_when: pkill_app.rc == 0
      failed_when: false
      when: ollama_remove_app
      tags: [ollama]

    - name: Ollama.app (Cask) entfernen
      community.general.homebrew_cask:
        name: ollama
        state: absent
      when: ollama_remove_app
      tags: [ollama]

    # Programme (feste Version, Updates nur bewusst mit --tags upgrade)
    - name: Ollama und Caddy installieren
      community.general.homebrew:
        name: [ollama, caddy]
        state: present
      tags: [ollama]

    - name: Ollama und Caddy aktualisieren (nur mit --tags upgrade)
      community.general.homebrew:
        name: [ollama, caddy]
        state: latest
      notify: [Ollama neu starten, Proxy neu starten]
      tags: [never, upgrade]

    # Logdateien
    - name: Logdateien für das Dienstkonto anlegen
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
        owner: "{{ ollama_service_user }}"
        group: staff
        mode: "0644"
        modification_time: preserve
        access_time: preserve
      loop: [/var/log/ollama.log, /var/log/ollama-proxy.log]
      tags: [ollama]

    - name: Logrotation einrichten
      become: true
      ansible.builtin.copy:
        dest: /etc/newsyslog.d/de.hdm.ollama.conf
        owner: root
        group: wheel
        mode: "0644"
        content: |
          # logfilename              owner:group                   mode count size(KB) when flags
          /var/log/ollama.log        {{ ollama_service_user }}:staff 644  5     10240    *    J
          /var/log/ollama-proxy.log  {{ ollama_service_user }}:staff 644  5     10240    *    J
      tags: [ollama]

    # Proxy mit Token
    - name: Proxy-Konfiguration schreiben (enthält das Token, nur für das Dienstkonto lesbar)
      become: true
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ config_dir }}/Caddyfile"
        owner: "{{ ollama_service_user }}"
        group: staff
        mode: "0600"
      notify: Proxy neu starten
      tags: [ollama, proxy]

    # LaunchDaemons
    - name: LaunchDaemons schreiben
      become: true
      ansible.builtin.template:
        src: "{{ item }}.plist.j2"
        dest: /Library/LaunchDaemons/{{ item }}.plist
        owner: root
        group: wheel
        mode: "0644"
      loop: [de.hdm.ollama, de.hdm.ollama-proxy]
      register: plists
      tags: [ollama, proxy]

    - name: Prüfen, welche LaunchDaemons geladen sind
      become: true
      ansible.builtin.command: launchctl print system/{{ item }}
      loop: [de.hdm.ollama, de.hdm.ollama-proxy]
      register: daemons
      changed_when: false
      failed_when: false
      tags: [ollama, proxy, models]

    # Eine geänderte plist wirkt erst nach bootout und bootstrap, ein kickstart reicht nicht.
    - name: LaunchDaemons laden, wenn sie neu oder geändert sind
      become: true
      ansible.builtin.shell: |
        launchctl bootout system/{{ item.0.item }} 2>/dev/null || true
        sleep 2
        launchctl bootstrap system /Library/LaunchDaemons/{{ item.0.item }}.plist
      loop: "{{ plists.results | zip(daemons.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
      when: item.0.changed or item.1.rc != 0
      tags: [ollama, proxy]

    - name: Dienste neu starten, falls sich Programm oder Proxy-Konfiguration geändert haben
      ansible.builtin.meta: flush_handlers
      tags: [ollama, proxy]

    - name: Warten, bis Ollama antwortet
      ansible.builtin.uri:
        url: http://127.0.0.1:11434/api/version
      register: ollama_up
      until: ollama_up.status == 200
      retries: 20
      delay: 3
      tags: [ollama, models]

    - name: Prüfen, dass Ollama unter dem Dienstkonto läuft (und nicht eine fremde Instanz)
      become: true
      ansible.builtin.shell: lsof -nP -iTCP:11434 -sTCP:LISTEN -Fu | sed -n 's/^u//p' | head -1
      register: listener_uid
      changed_when: false
      failed_when: listener_uid.stdout | trim != (ollama_service_uid | string)
      tags: [ollama, models]

    # Modelle
    - name: Vorhandene Modelle abfragen
      ansible.builtin.uri:
        url: http://127.0.0.1:11434/api/tags
      register: tags_result
      tags: [models]

    - name: Fehlende Modelle laden
      ansible.builtin.command: ollama pull {{ item }}
      environment:
        OLLAMA_HOST: 127.0.0.1:11434
      loop: "{{ ollama_models }}"
      when: >-
        (item if ':' in (item | split('/') | last) else item ~ ':latest')
        not in (tags_result.json.models | map(attribute='name') | list)
      throttle: "{{ model_pull_throttle }}"
      tags: [models]

  handlers:
    - name: Ollama neu starten
      become: true
      ansible.builtin.command: launchctl kickstart -k system/de.hdm.ollama

    - name: Proxy neu starten
      become: true
      ansible.builtin.command: launchctl kickstart -k system/de.hdm.ollama-proxy

- name: Dauerbetrieb ohne Ruhezustand
  hosts: dauerbetrieb
  become: true
  tasks:
    - name: Bisherige Energieeinstellungen einmalig sichern (für den Rückbau)
      ansible.builtin.shell: pmset -g custom > "{{ config_dir }}/pmset-vorher.txt"
      args:
        creates: "{{ config_dir }}/pmset-vorher.txt"
      tags: [power]

    - name: Ruhezustand ausschalten, nach Stromausfall neu starten
      ansible.builtin.command: pmset -a sleep 0 disksleep 0 autorestart 1
      changed_when: false
      tags: [power]
