- name: Ollama auf den Mac Minis einrichten
  hosts: minis
  environment:
    PATH: "{{ homebrew_prefix }}/bin:/usr/bin:/bin:/usr/sbin:/sbin"
  tasks:
    - name: Ordner für die Modelle anlegen
      become: true
      ansible.builtin.file:
        path: "{{ models_root }}/{{ item }}"
        state: directory
        owner: root
        group: staff
        mode: "2775"
      loop: [ollama, huggingface, lmstudio]
      tags: [base]

    - name: Ollama.app beenden
      ansible.builtin.command: pkill -x Ollama
      register: pkill_app
      changed_when: pkill_app.rc == 0
      failed_when: false
      when: ollama_remove_app
      tags: [ollama]

    - name: Ollama.app (Cask) entfernen
      community.general.homebrew_cask:
        name: ollama
        state: absent
      when: ollama_remove_app
      tags: [ollama]

    - name: Ollama (CLI) installieren bzw. aktualisieren
      community.general.homebrew:
        name: ollama
        state: latest
      notify: Ollama neu starten
      tags: [ollama]

    - name: Logdatei für den Daemon-Nutzer anlegen
      become: true
      ansible.builtin.file:
        path: /var/log/ollama.log
        state: touch
        owner: "{{ ansible_user }}"
        group: staff
        mode: "0644"
        modification_time: preserve
        access_time: preserve
      tags: [ollama]

    - name: LaunchDaemon für Ollama schreiben
      become: true
      ansible.builtin.template:
        src: de.hdm.ollama.plist.j2
        dest: /Library/LaunchDaemons/de.hdm.ollama.plist
        owner: root
        group: wheel
        mode: "0644"
      notify: Ollama neu starten
      tags: [ollama]

    - name: Prüfen, ob der LaunchDaemon geladen ist
      become: true
      ansible.builtin.command: launchctl print system/de.hdm.ollama
      register: daemon_loaded
      changed_when: false
      failed_when: false
      tags: [ollama, models]

    - name: LaunchDaemon laden
      become: true
      ansible.builtin.command: launchctl bootstrap system /Library/LaunchDaemons/de.hdm.ollama.plist
      when: daemon_loaded.rc != 0
      tags: [ollama]

    - name: Ollama neu starten, falls sich etwas geändert hat
      ansible.builtin.meta: flush_handlers
      tags: [ollama]

    - name: Warten, bis Ollama antwortet
      ansible.builtin.uri:
        url: http://127.0.0.1:11434/api/version
      register: ollama_up
      until: ollama_up.status == 200
      retries: 20
      delay: 3
      tags: [ollama, models]

    - name: Vorhandene Modelle abfragen
      ansible.builtin.uri:
        url: http://127.0.0.1:11434/api/tags
      register: tags_result
      tags: [models]

    - name: Fehlende Modelle laden
      ansible.builtin.command: ollama pull {{ item }}
      environment:
        OLLAMA_HOST: 127.0.0.1:11434
      loop: "{{ ollama_models }}"
      when: item not in (tags_result.json.models | map(attribute='name') | list)
      throttle: "{{ model_pull_throttle }}"
      tags: [models]

  handlers:
    - name: Ollama neu starten
      become: true
      ansible.builtin.command: launchctl kickstart -k system/de.hdm.ollama
