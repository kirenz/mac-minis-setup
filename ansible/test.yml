# Abnahmetest: prüft Text, Embedding und Bild über den Proxy mit Token
# sowie die Sperren ohne Token und für die Modellverwaltung.
# Aufruf: ansible-playbook test.yml --limit mini01
- name: Abnahmetest
  hosts: minis
  gather_facts: false
  vars:
    base: "http://127.0.0.1:{{ proxy_port }}"
    auth: { Authorization: "Bearer {{ ollama_proxy_token }}" }
    text_model: "{{ ollama_models | reject('search', 'embedding|image') | first }}"
    embed_model: "{{ ollama_models | select('search', 'embedding') | first | default('') }}"
    image_model: "{{ ollama_models | select('search', 'image') | first | default('') }}"
  tasks:
    - name: Ohne Token wird abgewiesen
      ansible.builtin.uri:
        url: "{{ base }}/api/version"
        status_code: 401

    - name: Modell löschen über das Netz wird abgewiesen, auch mit Token
      ansible.builtin.uri:
        url: "{{ base }}/api/delete"
        method: DELETE
        headers: "{{ auth }}"
        body_format: json
        body: { model: "gibt-es-nicht" }
        status_code: 403

    - name: Text erzeugen
      ansible.builtin.uri:
        url: "{{ base }}/api/generate"
        method: POST
        headers: "{{ auth }}"
        body_format: json
        body: { model: "{{ text_model }}", prompt: "Antworte nur mit: ok", stream: false, think: false, options: { num_predict: 20 } }
        timeout: 600
      register: text
      failed_when: text.status != 200 or (text.json.response | default('') | length) == 0

    - name: Embedding erzeugen
      ansible.builtin.uri:
        url: "{{ base }}/api/embed"
        method: POST
        headers: "{{ auth }}"
        body_format: json
        body: { model: "{{ embed_model }}", input: "Testsatz" }
        timeout: 300
      register: embed
      failed_when: embed.status != 200 or (embed.json.embeddings[0] | default([]) | length) == 0
      when: embed_model | length > 0

    - name: Bild erzeugen (experimentell, kann einige Minuten dauern)
      ansible.builtin.uri:
        url: "{{ base }}/v1/images/generations"
        method: POST
        headers: "{{ auth }}"
        body_format: json
        body: { model: "{{ image_model }}", prompt: "A modern university building in Stuttgart, morning light", response_format: b64_json }
        timeout: 900
      register: image
      failed_when: image.status != 200 or (image.json.data[0].b64_json | default('') | length) < 1000
      when: image_model | length > 0

    - name: Ergebnis
      ansible.builtin.debug:
        msg:
          text: "{{ text.json.response | default('-') | trim }}"
          embedding_dimensionen: "{{ embed.json.embeddings[0] | default([]) | length if embed is not skipped else '-' }}"
          bild_bytes_base64: "{{ image.json.data[0].b64_json | default('') | length if image is not skipped else '-' }}"
